[project]
name = "rag-agent-localhost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rexShailJs", email = "rexshailjs@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-chroma>=1.2.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.5.3",
    "langchain-groq>=1.2.1",
    "langchain-text-splitters>=1.2.0",
    "pymupdf4llm>=2.2",
    "pypdf>=6.0.0",
]

[project.scripts]
rag-agent-localhost = "rag_agent_localhost.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
